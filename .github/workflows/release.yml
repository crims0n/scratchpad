name: Stable Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Validate stable version
        id: version
        run: node scripts/check-stable-release.mjs >> "$GITHUB_OUTPUT"

      - name: Validate frontend
        run: npm run check

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  prepare:
    name: Prepare one candidate draft
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      # Push access is required to see existing drafts as well as create one.
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<SCRATCHPAD_RELEASE_NOTES'
            cat RELEASE_NOTES.md
            # Fixed footer so every release links verification, whatever the notes say.
            cat <<'FOOTER'

          ## Verifying Linux downloads

          Linux packages are covered by `SHA256SUMS`, signed as `SHA256SUMS.asc` with the Scratchpad release-signing key (fingerprint `1AD2 0240 0B0C 14AD 86F4 3E14 4F6B 122C D9DC CB40`). Follow [Verifying Linux downloads](https://github.com/crims0n/scratchpad/blob/main/docs/verify-linux-downloads.md) before installing.
          FOOTER
            echo 'SCRATCHPAD_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Check availability and create the draft once
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
        run: node scripts/prepare-stable-release.mjs >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify signed files (${{ matrix.platform }})
    needs: [validate, prepare]
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      # Windows signing exchanges GitHub OIDC tokens for Azure Artifact Signing
      # access; the federated credential only trusts the release-signing
      # environment (docs/windows-release-signing.md).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: >-
              --config src-tauri/tauri.release.conf.json
              --config src-tauri/tauri.macos-signing.conf.json
              --target universal-apple-darwin
              --bundles app,dmg
              -- --locked
            release_platform: macos
          - platform: ubuntu-22.04
            args: >-
              --config src-tauri/tauri.release.conf.json
              --bundles appimage,deb
              -- --locked
            release_platform: linux
          - platform: windows-latest
            args: >-
              --config src-tauri/tauri.release.conf.json
              --config src-tauri/tauri.windows-signing.conf.json
              --bundles nsis,msi
              -- --locked
            release_platform: windows

    runs-on: ${{ matrix.platform }}
    # Holds the release-signing secrets; protect it with required reviewers
    # and a main-only deployment branch policy (docs/release-signing.md).
    environment: release-signing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Import Linux release-signing key
        id: signing_key
        if: matrix.platform == 'ubuntu-22.04'
        env:
          RELEASE_SIGNING_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_GPG_PRIVATE_KEY }}
          RELEASE_SIGNING_GPG_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_GPG_PASSPHRASE }}
        run: scripts/import-release-signing-key.sh site/release-signing-key.asc

      - name: Set up Windows code signing
        if: matrix.platform == 'windows-latest'
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: ./scripts/setup-windows-signing.ps1 -Description 'Scratchpad'

      - name: Set up macOS code signing
        id: macos_signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: scripts/setup-macos-signing.sh src-tauri/tauri.macos-signing.conf.json

      - name: Build signed artifacts locally
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          # Embed a GPG signature in the AppImage; a signing failure fails the build.
          SIGN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          SIGN_KEY: ${{ steps.signing_key.outputs.fingerprint }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ matrix.platform == 'ubuntu-22.04' && secrets.RELEASE_SIGNING_GPG_PASSPHRASE || '' }}
          APPIMAGETOOL_FORCE_SIGN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          # Notarize and staple the macOS app. The signing identity comes from
          # tauri.macos-signing.conf.json and the keychain imported above.
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && vars.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && vars.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ steps.macos_signing.outputs.api_key_path }}
        with:
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Stage canonical release filenames
        id: stage_assets
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_PLATFORM: ${{ matrix.release_platform }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: node scripts/stage-release-assets.mjs

      - name: Verify Windows signatures
        if: matrix.platform == 'windows-latest'
        env:
          ARTIFACT_PATHS: ${{ steps.stage_assets.outputs.asset_paths }}
          # The common name on the Artifact Signing certificate. Changing it is
          # a reviewed code change, not a settings change.
          WINDOWS_SIGNING_PUBLISHER: Patrick McDowell
          VERIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/release-verification/${{ matrix.platform }}.json
        run: |
          $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json)
          $setup = @($paths | Where-Object { $_ -like '*-setup.exe' })
          $msi = @($paths | Where-Object { $_ -like '*.msi' })
          if ($setup.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one NSIS setup and one MSI, got: $($paths -join ', ')"
          }
          ./scripts/verify-windows-release.ps1 -Setup $setup[0] -Msi $msi[0]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-verification.mjs windows $setup[0] $msi[0]

      - name: Notarize and verify macOS release
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          MACOS_SIGNING_TEAM_ID: ${{ steps.macos_signing.outputs.team_id }}
          MACOS_SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.macos_signing.outputs.api_key_path }}
          VERIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/release-verification/${{ matrix.platform }}.json
        run: scripts/finalize-macos-release.sh --assets-dir "$RUNNER_TEMP/release-assets"

      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'macos-latest'
        run: |
          security delete-keychain "$RUNNER_TEMP/scratchpad-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/developer-id.p12"

      - name: Sign and verify Linux release checksums
        if: matrix.platform == 'ubuntu-22.04'
        env:
          SIGNING_KEY_FINGERPRINT: ${{ steps.signing_key.outputs.fingerprint }}
          VERIFICATION_EVIDENCE_PATH: ${{ runner.temp }}/release-verification/${{ matrix.platform }}.json
        run: scripts/sign-linux-release.sh site/release-signing-key.asc --assets-dir "$RUNNER_TEMP/release-assets"

      - name: Remove release-signing key
        if: always() && matrix.platform == 'ubuntu-22.04'
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$HOME/.gnupg"

      - name: Save verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          overwrite: true

      - name: Save hashes of signature-checked files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-verification/${{ matrix.platform }}.json
          if-no-files-found: error
          overwrite: true

  upload-draft:
    name: Upload verified files to the candidate draft
    needs: [validate, prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download verified platform files from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Download platform verification records from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-verification-*
          path: ${{ runner.temp }}/release-verification
          merge-multiple: true
          digest-mismatch: error

      - name: Upload verified bytes and download the final draft by asset ID
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          VERIFICATION_EVIDENCE_DIR: ${{ runner.temp }}/release-verification
          RELEASE_SNAPSHOT_DIR: ${{ runner.temp }}/uploaded-draft
        run: node scripts/upload-release-draft.mjs

      - name: Save exact downloaded draft for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uploaded-draft-${{ needs.prepare.outputs.release_id }}
          path: ${{ runner.temp }}/uploaded-draft
          if-no-files-found: error
          overwrite: true

  verify-draft:
    name: Verify downloaded signed draft
    needs: [validate, prepare, upload-draft]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      verified_draft: ${{ steps.verify.outputs.verified_draft }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Download exact final-draft snapshot from the upload job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uploaded-draft-${{ needs.prepare.outputs.release_id }}
          path: ${{ runner.temp }}/uploaded-draft
          digest-mismatch: error

      - name: Download platform verification records from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-verification-*
          path: ${{ runner.temp }}/release-verification
          merge-multiple: true
          digest-mismatch: error

      - name: Verify final downloaded bytes and website recognition
        id: verify
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/verify-release-draft.mjs \
            --release "$RUNNER_TEMP/uploaded-draft/release.json" \
            --assets-dir "$RUNNER_TEMP/uploaded-draft/assets" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" \
            --evidence-dir "$RUNNER_TEMP/release-verification"

  confirm-draft:
    name: Confirm current signed draft
    needs: [validate, prepare, verify-draft]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      # Reading a draft requires push access. No npm packages run in this job.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Confirm live draft identity and verified asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          VERIFIED_DRAFT: ${{ needs.verify-draft.outputs.verified_draft }}
        run: node scripts/confirm-release-draft.mjs
