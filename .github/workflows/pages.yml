name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "images/logo.png"
      - "images/preview.png"
      - "scripts/generate-release-manifest.mjs"
      - "site/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pages-staging/assets
          cp -R site/. .pages-staging/
          cp images/logo.png images/preview.png .pages-staging/assets/
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/generate-release-manifest.mjs --input "$RUNNER_TEMP/releases.json" --output .pages-staging/release.json
          touch .pages-staging/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-staging

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
