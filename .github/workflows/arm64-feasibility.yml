name: ARM64 build feasibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/arm64-feasibility.yml
      - scripts/verify-arm64-build.mjs
      - test/arm64-build.test.js

permissions:
  contents: read

concurrency:
  group: arm64-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned ARM64 packages (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Confirm native ARM64 toolchain
        run: |
          node -e "if (process.arch !== 'arm64') throw new Error('Expected native ARM64 Node.js'); console.log(process.platform, process.arch)"
          node -e "const host = require('node:child_process').execFileSync('rustc', ['-vV'], {encoding:'utf8'}); console.log(host); if (!host.includes('host: ${{ matrix.target }}')) throw new Error('Expected native ARM64 Rust host')"
          node -e "const config = require('./src-tauri/tauri.conf.json'); if (config.identifier !== 'io.github.crims0n.scratchpad.dev' || config.mainBinaryName !== 'scratchpad-dev') throw new Error('Expected isolated development identity')"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Use the isolated development identity. Do not load production release
      # or signing configs, use signing secrets, or create a GitHub release.
      - name: Build unsigned development packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Inspect Linux package payloads
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"
          mapfile -t appimages < <(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')
          mapfile -t debs < <(find "$bundle/deb" -maxdepth 1 -type f -name '*.deb')
          [[ ${#appimages[@]} -eq 1 && ${#debs[@]} -eq 1 ]] || { echo 'Expected one AppImage and one DEB'; exit 1; }
          [[ "$(dpkg-deb --field "${debs[0]}" Architecture)" == arm64 ]] || { echo 'DEB architecture must be arm64'; exit 1; }
          inspection="$RUNNER_TEMP/arm64-inspection"
          mkdir -p "$inspection/deb" "$inspection/appimage"
          dpkg-deb --extract "${debs[0]}" "$inspection/deb"
          chmod +x "${appimages[0]}"
          (cd "$inspection/appimage" && "${appimages[0]}" --appimage-extract)
          node scripts/verify-arm64-build.mjs --platform linux \
            --package "${appimages[0]}" --package "${debs[0]}" \
            --built "src-tauri/target/aarch64-unknown-linux-gnu/release/scratchpad-dev" \
            --deb "$inspection/deb/usr/bin/scratchpad-dev" \
            --appimage "$inspection/appimage/squashfs-root/usr/bin/scratchpad-dev" \
            --output-dir "$RUNNER_TEMP/arm64-feasibility"

      - name: Inspect Windows package payloads
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/aarch64-pc-windows-msvc/release/bundle'
          $setups = @(Get-ChildItem (Join-Path $bundle 'nsis') -File -Filter '*-setup.exe')
          $msis = @(Get-ChildItem (Join-Path $bundle 'msi') -File -Filter '*.msi')
          if ($setups.Count -ne 1 -or $msis.Count -ne 1) { throw 'Expected one NSIS setup and one MSI' }
          $inspection = Join-Path $env:RUNNER_TEMP 'arm64-inspection'
          $msiDir = Join-Path $inspection 'msi'
          $nsisDir = Join-Path $inspection 'nsis'
          New-Item -ItemType Directory -Force $msiDir, $nsisDir | Out-Null
          $msiLog = Join-Path $inspection 'msi.log'
          $msiexec = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$($msis[0].FullName)`"", '/qn', "TARGETDIR=`"$msiDir`"", '/l*v', "`"$msiLog`""
          )
          if ($msiexec.ExitCode -ne 0) { Get-Content $msiLog -Tail 100; throw "MSI extraction failed: $($msiexec.ExitCode)" }
          $setup = Start-Process $setups[0].FullName -Wait -PassThru -ArgumentList @('/S', "/D=$nsisDir")
          if ($setup.ExitCode -ne 0) { throw "NSIS installation failed: $($setup.ExitCode)" }
          $msiApps = @(Get-ChildItem $msiDir -Recurse -File -Filter 'scratchpad-dev.exe')
          $nsisApps = @(Get-ChildItem $nsisDir -Recurse -File -Filter 'scratchpad-dev.exe')
          if ($msiApps.Count -ne 1 -or $nsisApps.Count -ne 1) { throw 'Expected one development executable in each package' }
          node scripts/verify-arm64-build.mjs --platform windows `
            --package $setups[0].FullName --package $msis[0].FullName `
            --built 'src-tauri/target/aarch64-pc-windows-msvc/release/scratchpad-dev.exe' `
            --msi $msiApps[0].FullName --nsis $nsisApps[0].FullName `
            --output-dir (Join-Path $env:RUNNER_TEMP 'arm64-feasibility')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save unsigned packages and architecture evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-arm64-feasibility-${{ matrix.os }}
          path: ${{ runner.temp }}/arm64-feasibility
          if-no-files-found: error
          retention-days: 7
