name: Beta Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build beta (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --target universal-apple-darwin
              --bundles app,dmg
          - platform: ubuntu-22.04
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --bundles appimage,deb
          - platform: windows-latest
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --bundles nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and draft beta release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: scratchpad-beta-v__VERSION__
          releaseName: Scratchpad Beta v__VERSION__
          releaseBody: |
            Beta build for testing. Back up important workspace files before testing.

            These artifacts are not yet production-signed. macOS and Windows may display a security warning.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
