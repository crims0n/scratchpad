name: Beta Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run check

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: scratchpad-beta-v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Bump the application version before starting another beta release."
            exit 1
          fi

  build:
    name: Build beta (${{ matrix.platform }})
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --target universal-apple-darwin
              --bundles app,dmg
          - platform: ubuntu-22.04
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --bundles appimage,deb
          - platform: windows-latest
            args: >-
              --config src-tauri/tauri.beta.conf.json
              --bundles nsis,msi

    runs-on: ${{ matrix.platform }}
    # Holds the release-signing secrets; protect it with required reviewers
    # and a main-only deployment branch policy (docs/release-signing.md).
    environment: release-signing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<SCRATCHPAD_RELEASE_NOTES'
            cat RELEASE_NOTES.md
            echo 'SCRATCHPAD_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Import Linux release-signing key
        id: signing_key
        if: matrix.platform == 'ubuntu-22.04'
        env:
          RELEASE_SIGNING_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_GPG_PRIVATE_KEY }}
          RELEASE_SIGNING_GPG_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_GPG_PASSPHRASE }}
        run: scripts/import-release-signing-key.sh site/release-signing-key.asc

      - name: Build and draft beta release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Embed a GPG signature in the AppImage; a signing failure fails the build.
          SIGN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          SIGN_KEY: ${{ steps.signing_key.outputs.fingerprint }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ matrix.platform == 'ubuntu-22.04' && secrets.RELEASE_SIGNING_GPG_PASSPHRASE || '' }}
          APPIMAGETOOL_FORCE_SIGN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
        with:
          tagName: scratchpad-beta-v__VERSION__
          releaseName: Scratchpad Beta v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Sign and verify Linux release checksums
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          SIGNING_KEY_FINGERPRINT: ${{ steps.signing_key.outputs.fingerprint }}
        run: scripts/sign-linux-release.sh site/release-signing-key.asc

      - name: Remove release-signing key
        if: always() && matrix.platform == 'ubuntu-22.04'
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$HOME/.gnupg"
