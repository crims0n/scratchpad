name: App Store

# Builds the Mac App Store package from main, separately from the website
# release. It never runs automatically. See docs/appstore-release.md.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  package:
    name: Build, validate and upload
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    # Holds the App Store secrets; protected by a required reviewer and a
    # main-only deployment branch policy.
    environment: appstore-signing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target
          key: appstore-release

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build, verify and validate the App Store package
        id: package
        env:
          APPSTORE_DISTRIBUTION_P12: ${{ secrets.APPSTORE_DISTRIBUTION_P12 }}
          APPSTORE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPSTORE_DISTRIBUTION_P12_PASSWORD }}
          APPSTORE_INSTALLER_P12: ${{ secrets.APPSTORE_INSTALLER_P12 }}
          APPSTORE_INSTALLER_P12_PASSWORD: ${{ secrets.APPSTORE_INSTALLER_P12_PASSWORD }}
          APPSTORE_PROVISION_PROFILE: ${{ secrets.APPSTORE_PROVISION_PROFILE }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          # Increases with every run, as App Store Connect requires.
          BUILD_NUMBER: ${{ github.run_number }}
          UPLOAD: ${{ inputs.upload }}
        run: scripts/appstore-package.sh

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/scratchpad-appstore.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/appstore/private_keys" "$RUNNER_TEMP/appstore/"*.p12

      - name: Keep the package for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scratchpad-appstore-${{ github.run_number }}
          path: ${{ steps.package.outputs.package }}
          retention-days: 14
          if-no-files-found: error
