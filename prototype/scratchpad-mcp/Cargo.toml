[package]
name = "scratchpad-mcp"
version = "0.0.0"
description = "Feasibility prototype: read-only MCP server over a portable Scratchpad workspace."
license = "GPL-3.0-or-later"
publish = false
edition = "2021"

[dependencies]
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
