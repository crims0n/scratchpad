[package]
name = "scratchpad"
version = "0.5.1"
description = "A lightweight, offline-first Markdown scratchpad for the desktop."
license = "GPL-3.0-or-later"
authors = ["crims0n"]
repository = "https://github.com/crims0n/scratchpad"
homepage = "https://github.com/crims0n/scratchpad"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scratchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-opener = "2.5.4"
