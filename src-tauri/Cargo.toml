[package]
name = "scratchpad"
version = "1.1.0"
description = "A lightweight, offline-first Markdown scratchpad for the desktop."
license = "GPL-3.0-or-later"
authors = ["crims0n"]
repository = "https://github.com/crims0n/scratchpad"
homepage = "https://github.com/crims0n/scratchpad"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scratchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
dunce = "1.0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
subtle = "2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[features]
# Mac App Store build flavor. Off by default: released Developer ID, Windows,
# and Linux packages never enable it. CI lints and tests both configurations.
appstore = ["dep:block2", "dep:objc2-foundation"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "NSError", "NSFileCoordinator", "NSFilePresenter", "NSOperation", "NSObject", "NSString", "NSURL"] }
dispatch2 = "0.3.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
